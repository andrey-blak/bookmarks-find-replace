<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="editor.css">
  <link rel="icon" href="icons/icon.svg">
  <script src="editor.js" type="module"></script>
</head>
<body>

<header class="topbar">
  <button id="toggleSidebar" class="icon-button" type="button" data-i18n-title="toggleSidebar">
    <!-- src/icons/sidebar-left.svg, stroke re-aimed at currentColor so it
         follows the browser theme. -->
    <svg width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="2" rx="2" ry="2" width="18" height="18" x="3" y="3"/>
      <line stroke="currentColor" stroke-miterlimit="10" stroke-width="2" x1="9" x2="9" y1="21" y2="3"/>
    </svg>
  </button>
  <h1 data-i18n="extensionName"></h1>
</header>

<div class="layout" id="layout">

  <aside class="sidebar" id="sidebar">
    <nav id="folderTree" role="tree"></nav>
  </aside>

  <div id="resizer" class="resizer" data-i18n-title="resizeSidebar" aria-hidden="true"></div>

  <main class="main">
    <div id="error" class="error" role="alert" hidden>
      <span id="errorText" data-i18n="loadError"></span>
      <button id="retry" class="icon-button" type="button" data-i18n="retry"></button>
    </div>

    <div class="scope-bar">
      <div class="scope-line">
        <span class="muted" data-i18n="scopeLabel"></span>
        <strong id="scopePath"></strong>
      </div>
      <label class="inline-option">
        <input type="checkbox" id="recursive" checked>
        <span data-i18n="includeSubfolders"></span>
      </label>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" id="tabNames" class="tab active" role="tab" aria-selected="true"
              data-mode="names" data-i18n="tabNames"></button>
      <button type="button" id="tabUrls" class="tab" role="tab" aria-selected="false"
              data-mode="urls" data-i18n="tabUrls"></button>
    </div>

    <section class="editor">
      <div class="field">
        <label for="find" data-i18n="findLabel"></label>
        <div class="find-row">
          <input id="find" type="text" autocomplete="off" spellcheck="false">
          <button id="emojiPreset" class="preset-button" type="button" data-i18n="removeEmoji"></button>
        </div>
      </div>
      <div class="field">
        <label for="replace" data-i18n="replaceLabel"></label>
        <input id="replace" type="text" autocomplete="off" spellcheck="false">
      </div>
      <div class="options">
        <label><input type="checkbox" id="regex">
          <span data-i18n="regexLabel"></span></label>
        <label><input type="checkbox" id="caseSensitive">
          <span data-i18n="caseSensitiveLabel"></span></label>
        <label id="wholeWordOption" hidden><input type="checkbox" id="wholeWord">
          <span data-i18n="wholeWordLabel"></span></label>
        <label id="foldersOption"><input type="checkbox" id="includeFolders">
          <span data-i18n="includeFolderNames"></span></label>
      </div>
    </section>

    <p class="hint muted" data-i18n="keyboardHint"></p>

    <div id="formError" class="error" role="alert" hidden></div>

    <div id="applyResult" class="apply-result" role="status" hidden></div>

    <div class="preview-heading">
      <span id="summary" class="muted" role="status"></span>
      <button id="undo" type="button" hidden></button>
      <button id="apply" class="primary" type="button" disabled data-i18n="applyNone"></button>
    </div>

    <table class="preview">
      <thead>
        <tr>
          <th class="col-toggle"><input type="checkbox" id="selectAll"></th>
          <th scope="col" data-i18n="colCurrent"></th>
          <th scope="col" data-i18n="colNew"></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="previewRows"></tbody>
    </table>
  </main>

</div>

</body>
</html>
